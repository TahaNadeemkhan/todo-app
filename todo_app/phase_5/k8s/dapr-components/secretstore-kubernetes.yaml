# Dapr Secret Store Component for Kubernetes Secrets
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: todo-app
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    - name: defaultValue
      value: "none"
scopes:
  - backend-api
  - notification-service
  - recurring-task-service
