# Dapr State Store Component for Redis (Local Dev Stability)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: todo-app
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis:6379
  - name: redisPassword
    value: ""
scopes:
  - backend-api
  - notification-service
  - recurring-task-service
