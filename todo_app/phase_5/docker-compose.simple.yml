# Simplified Docker Compose (PostgreSQL Only)
# Use this if Kafka image issues persist

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: phase5-postgres
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
